# WordPress REST API (wp-json) の記事投稿・更新エンドポイント向け除外ルール。
#
# 背景: 複数段落・Mermaid 図・URL リンクなどを含む正規のブログ記事本文を
# POST すると、CRS の匿名スコアが ANOMALY_INBOUND のしきい値を超えてしまい、
# 認証済みの正規リクエストまで 403 Forbidden で誤検知ブロックされていた。
#
# 対応: Authorization ヘッダ (Basic 認証 / アプリケーションパスワード) を伴う
# POST/PUT のみに限定し、wp-json の記事・固定ページ書き込みエンドポイントに
# 対してのみ CRS の検査を除外する。GET (記事一覧・取得) や、認証ヘッダの無い
# 匿名リクエスト、他のパス (wp-login.php, wp-admin など) は引き続き CRS の
# フル検査対象のまま。
SecRule REQUEST_METHOD "@rx ^(POST|PUT)$" \
    "id:900100,\
    phase:1,\
    chain"
    SecRule REQUEST_FILENAME "@rx ^/wp-json/wp/v2/(posts|pages)(/\d+)?/?$" \
        "chain"
        SecRule REQUEST_HEADERS:Authorization "@rx ." \
            "pass,nolog,ctl:ruleRemoveByTag=OWASP_CRS"
