# =============================================================================
# Demo apps override — docker-compose.demo.yml.template
# =============================================================================
#
# 「Works に載せる実稼働デモ」を追加するためのテンプレート。
#
# 使い方:
#   1. このファイルを docker-compose.demo.yml としてコピー
#        cp docker-compose.demo.yml.template docker-compose.demo.yml
#   2. 下の `demo-todo` / `demo-static` ブロックを参考にサービスを追加・編集
#   3. 起動
#        docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d
#   4. Nginx 側に platform/nginx_conf/conf.d/demo-app.conf.template から
#      <sub>.conf を生成し、サブドメインを公開
#
# ポリシー:
#   - デモコンテナはホスト側ポートを公開しない (ports: は書かない)。
#     Nginx (proxy_network 経由) から内部 DNS で名前解決して接続する。
#   - 必ず networks: に proxy_network を含める。
#   - データを永続化したい場合は volumes でホスト側にバインドする。
#   - 1サービス1作品。Work CPT の Demo URL に対応する FQDN を設定する。

services:

  # ---------------------------------------------------------------------------
  # nginx を proxy_network に接続（デモコンテナへの疎通用）
  # ---------------------------------------------------------------------------
  nginx:
    networks:
      - proxy_network

  # ---------------------------------------------------------------------------
  # docker_sales_management デモ
  # 公開 URL : https://sales.makoto-kamimura.com
  # Nginx conf: nginx_data/conf.d/sales.conf
  # ---------------------------------------------------------------------------
  demo-sales-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo_password
      POSTGRES_DB: sales_demo
      TZ: Asia/Tokyo
    volumes:
      - demo_sales_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d sales_demo"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - demo_sales_backend

  demo-sales-api:
    build:
      context: ../app/docker_sales_management/app/api
      dockerfile: Dockerfile
    command: bash -c "bundle exec rails db:prepare && bundle exec rails s -b 0.0.0.0 -p 3000"
    environment:
      RAILS_ENV: development
      DATABASE_HOST: demo-sales-db
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo_password
      POSTGRES_DB: sales_demo
      RAILS_LOG_TO_STDOUT: "true"
      BUNDLE_PATH: /usr/local/bundle
    depends_on:
      demo-sales-db:
        condition: service_healthy
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - proxy_network
      - demo_sales_backend

  demo-sales-web:
    build:
      context: ../app/docker_sales_management/app/web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE: https://sales.makoto-kamimura.com/api
      API_BASE_INTERNAL: http://demo-sales-api:3000/api
      NODE_ENV: development
    depends_on:
      - demo-sales-api
    expose:
      - "3001"
    restart: unless-stopped
    networks:
      - proxy_network
      - demo_sales_backend

  # ---------------------------------------------------------------------------
  # 例 1: Node.js / 自前イメージ (例: TODO アプリ)
  # ---------------------------------------------------------------------------
  demo-todo:
    # 自前 Dockerfile を使う場合:
    # build:
    #   context: ../app/demo-todo
    #   dockerfile: Dockerfile
    image: node:20-alpine
    working_dir: /app
    command: ["sh", "-c", "echo 'replace me' && tail -f /dev/null"]
    # ホスト側ポートは公開しない (Nginx 経由のみ)
    expose:
      - "3000"
    environment:
      NODE_ENV: production
    volumes:
      - ../app/demo-todo:/app
    restart: unless-stopped
    networks:
      - proxy_network

  # ---------------------------------------------------------------------------
  # 例 2: 静的サイト (LP / 資料 / Vite ビルド成果物 など)
  # ---------------------------------------------------------------------------
  demo-static:
    image: nginx:alpine
    expose:
      - "80"
    volumes:
      - ../app/demo-static:/usr/share/nginx/html:ro
    restart: unless-stopped
    networks:
      - proxy_network

  # ---------------------------------------------------------------------------
  # 例 3: 既存イメージをそのまま使う (例: n8n, Grafana, etc.)
  # ---------------------------------------------------------------------------
  # demo-foo:
  #   image: vendor/foo:latest
  #   expose:
  #     - "8080"
  #   environment:
  #     FOO_BAR: baz
  #   volumes:
  #     - ../app/demo-foo:/data
  #   restart: unless-stopped
  #   networks:
  #     - proxy_network

volumes:
  demo_sales_db_data:
    driver: local

networks:
  # nginx とデモコンテナをつなぐ内部プロキシネットワーク
  # デモアプリを追加するたびにここへ接続する (proxy_network を networks: に含める)
  proxy_network:
    driver: bridge
  # demo-sales-* 専用の内部ネットワーク（外部疎通不可）
  demo_sales_backend:
    driver: bridge
    internal: true
