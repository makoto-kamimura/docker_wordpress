[Definition]
# WordPress /wp-login.php への POST を繰り返す IP を検知
# 例: 192.168.1.1 - - [14/Jun/2026:01:06:59 +0000] "POST /wp-login.php HTTP/2.0" 200 ...
#
# [^"]* を挟んでクエリ文字列付きも拾う。旧regex は末尾を " HTTP" 決め打ちしていたため
#   POST /wp-login.php?action=register
#   POST /wp-login.php?redirect_to=...&reauth=1
#   POST /wp-login.php/xmlrpc.php
# を取りこぼしていた。
failregex = ^<HOST> .+ "POST /wp-login\.php[^"]* HTTP

ignoreregex =
