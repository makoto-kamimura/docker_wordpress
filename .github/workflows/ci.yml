name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 週次でイメージ脆弱性スキャンを再実行 (毎週月曜 03:15 UTC)
    - cron: "15 3 * * 1"

jobs:
  compose-validate:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render .env from .env.example
        working-directory: platform
        run: cp .env.example .env
      - name: Validate base
        working-directory: platform
        run: docker compose config --quiet
      - name: Validate with all profiles
        working-directory: platform
        run: docker compose --profile admin --profile stats config --quiet

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@2.0.0
        env:
          SHELLCHECK_OPTS: -e SC1091
        with:
          scandir: platform/scripts

  trivy-image-scan:
    name: Trivy image scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - mariadb:10.11.13
          - wordpress:6.7.2-php8.3-apache
          - wordpress:cli-2.10.0-php8.3
          - owasp/modsecurity-crs:nginx-alpine
          - redis:7.4.2-alpine
          - certbot/certbot:v2.11.0
          - phpmyadmin/phpmyadmin:5.2.1
          - louislam/uptime-kuma:1.23.13
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ matrix.image }}
          severity: CRITICAL,HIGH
          exit-code: "0" # まずは収集のみ。閾値を厳しくする時は "1"
          ignore-unfixed: true
          format: table
