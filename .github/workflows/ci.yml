name: CI

on:
  push:
    # このリポジトリのデフォルトブランチは master。
    # main を指定していた間は push 由来の実行が 1 件も発生していなかった。
    branches: [master]
  pull_request:
  # 結果をすぐ確認したい時に手動実行できるようにする
  workflow_dispatch:
  schedule:
    # 週次でイメージ脆弱性スキャンを再実行 (毎週月曜 03:15 UTC)
    - cron: "15 3 * * 1"

jobs:
  compose-validate:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render .env from .env.example
        working-directory: platform
        run: cp .env.example .env
      - name: Validate base
        working-directory: platform
        run: docker compose config --quiet
      - name: Validate with all profiles
        working-directory: platform
        run: docker compose --profile admin --profile stats config --quiet

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # サードパーティ action はタグを書き換えられる可能性があるため SHA で固定する
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        env:
          SHELLCHECK_OPTS: -e SC1091
        with:
          scandir: platform/scripts

  trivy-image-scan:
    name: Trivy image scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # SARIF を code scanning へ上げるために必要
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # slug は SARIF のファイル名と category に使う。
        # image をそのまま使うと "/" や ":" が入って扱えないため分けている。
        include:
          - image: mariadb:10.11.13
            slug: mariadb
          - image: wordpress:6.7.2-php8.3-apache
            slug: wordpress
          - image: wordpress:cli-2.10.0-php8.3
            slug: wordpress-cli
          - image: owasp/modsecurity-crs:nginx-alpine
            slug: modsecurity-crs
          - image: redis:7.4.2-alpine
            slug: redis
          - image: certbot/certbot:v2.11.0
            slug: certbot
          - image: phpmyadmin/phpmyadmin:5.2.1
            slug: phpmyadmin
          - image: louislam/uptime-kuma:1.23.13
            slug: uptime-kuma
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy
        # 2026-03-19 のサプライチェーン攻撃で 0.34.2 以前のタグは悪意あるコミットへ
        # force-push された。復旧時に旧タグは削除されたため @0.24.0 は解決できず、
        # このジョブは 2026-07 以降ずっと Set up job で失敗していた。
        # 攻撃はタグを書き換える手口だったので、タグではなく SHA で固定する。
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ matrix.image }}
          severity: CRITICAL,HIGH
          exit-code: "0" # ここで落とさない。検出は下の SARIF アップロードで可視化する
          ignore-unfixed: true
          format: sarif
          output: trivy-${{ matrix.slug }}.sarif

      # 検出結果を Security > Code scanning に出す。
      # ログを開かないと分からない状態だと、失敗も検出も誰にも気付かれない
      # （実際 2026-07 以降このジョブは落ち続けていたが放置されていた）。
      - name: Upload SARIF
        # サードパーティ action と同様、タグではなく SHA で固定する
        uses: github/codeql-action/upload-sarif@486fec2a3ea2626afcd8c7e9208b4f515078dd7e # codeql-bundle-v2.26.4
        with:
          sarif_file: trivy-${{ matrix.slug }}.sarif
          # category を分けないと、matrix の各ジョブが互いの結果を上書きする
          category: trivy-${{ matrix.slug }}
